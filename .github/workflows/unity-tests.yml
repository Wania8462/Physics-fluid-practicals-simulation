name: Unity tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Runs on the self-hosted PC, which is already signed in to Unity, so no license secrets are needed.
# Runs queue one after another because two Unity runs can't open the same project at once.
concurrency:
  group: unity-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The job name is the status check to require in the branch protection rule
  all-tests:
    name: All Unity tests
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: false # keeps Library/ between runs so assets aren't reimported every time

      - name: EditMode tests
        run: unity test . --mode EditMode --output ./results/editmode.xml

      - name: PlayMode tests
        run: unity test . --mode PlayMode --output ./results/playmode.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/
